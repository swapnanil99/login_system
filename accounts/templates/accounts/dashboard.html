<!-- accounts/templates/accounts/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
</head>
<body style="font-family: system-ui; background:#0f172a; color:#e5e7eb;">

  <div style="max-width: 600px; margin: 60px auto; padding: 24px; background:#020617; border-radius:16px; border:1px solid #1f2933;">
    <h1 style="font-size: 24px; margin-bottom: 12px;">Welcome, {{ request.user.username }} 👋</h1>
    <p style="margin-bottom: 24px; color:#9ca3af;">
      You are successfully logged in. Ei page sudhu logged-in user dekhte parbe.
    </p>

    <a href="{% url 'logout' %}"
       style="display:inline-block; padding: 10px 18px; border-radius: 999px;
              background:linear-gradient(135deg, #ef4444, #b91c1c);
              color:white; text-decoration:none; font-weight:600;">
      Logout
    </a>
  </div>

</body>
</html>
