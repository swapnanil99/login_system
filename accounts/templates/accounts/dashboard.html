<!-- accounts/templates/accounts/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      padding: 1rem;
    }

    .dashboard-card {
      max-width: 600px;
      margin: 60px auto;
      padding: 24px;
      background: #020617;
      border-radius: 16px;
      border: 1px solid #1f2933;
    }

    .dashboard-title {
      font-size: 24px;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .dashboard-text {
      margin-bottom: 24px;
      color: #9ca3af;
      line-height: 1.5;
    }

    .logout-btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .dashboard-card {
        margin: 24px auto;
        padding: 18px;
      }

      .dashboard-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-card">
    <h1 class="dashboard-title">Welcome, {{ request.user.username }} 👋</h1>
    <p class="dashboard-text">
      You are successfully logged in. Ei page sudhu logged-in user dekhte parbe.
    </p>

    <a href="{% url 'logout' %}" class="logout-btn">
      Logout
    </a>
  </div>

</body>
</html>
